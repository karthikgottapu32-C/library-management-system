services:
  - type: web
    name: library-management-system
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --prefix=backend && npm ci --prefix=frontend && npm run build --prefix=frontend
    startCommand: npm start --prefix=backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: PGPOOL_MAX
        value: 5
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
